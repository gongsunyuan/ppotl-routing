[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trl-sb3"
version = "0.1.0"
description = "TRL routing ablation rebuilt on Gymnasium + Stable-Baselines3 (clean-room, legacy-faithful)"
requires-python = ">=3.13,<3.14"
# 与 requirements.lock 完全一致的 9 条 == 钉版。editable 安装一律加 --no-deps：
# 依赖的安装与复现由 requirements.lock 头部的命令序列管理，pyproject 只做声明镜像。
dependencies = [
    "torch==2.13.0+cu126",       # cu126 wheel 仅在 https://download.pytorch.org/whl/cu126，不在 PyPI
    "stable-baselines3==2.7.0",
    "gymnasium==1.2.0",
    "networkx==3.4.2",
    "pyyaml==6.0.2",
    "numpy==2.2.6",
    "pytest==8.3.5",
    "matplotlib==3.10.9",
    "scipy==1.15.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trl_sb3"]

[tool.basedpyright]
# tests/ 以顶层模块互引（test_freeze ← test_sb3_smoke），与 pytest prepend 导入模式
# （tests/ 目录进 sys.path）一致；类型检查器同口径解析。
extraPaths = ["tests"]

# 下列规则置 none 的理由（2026-08-30 basedpyright 1.39.10 全量清理时的决策）：
# 依赖面无类型（scipy 无 stubs 且 scipy-stubs 不在 requirements.lock 钉版内；
# SB3/gymnasium/networkx/pyyaml 的值经 yaml.safe_load / argparse / VecEnv API
# 以 Any 流入），逐点标注只能复述库的无知、不增安全性；白盒测试按设计读
# RoutingEnv 私有态（_n/_paths/_in_rate 等，determinism/oracle 表征）；
# argparse add_argument / env.reset / model.learn / matplotlib 为副作用型调用，
# 返回值按惯例弃置。规则本身保留在 basedpyright 升级依赖补齐类型后可再开。
reportMissingTypeStubs = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportUnusedCallResult = "none"
reportPrivateUsage = "none"
