    - {version: 4, date: "2026-09-09", change: "源域切换立项（DEVIATIONS #17，D6/D7/D8 用户裁决）：保护对象改为 4 新目标场景（Claranet_failure@500 / Abilene@500 / NFSCNET@500 / Claranet@1500，随源 CERNET→Claranet 重定义）；load_sweep 主拓扑解释改为 Claranet.gml（预训练源拓扑随切换）；D7 探针 6 搭配不并入主表、D8 @300 轻载不进主表（维持搁置）；旧 287 维协议预构建网格作废。θ/W/k/α 与 v3 一致不动"}
