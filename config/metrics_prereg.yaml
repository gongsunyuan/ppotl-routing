    - {version: 2, date: "2026-08-31", change: "叙事增项注册（计划 §5 主表余量，冻结前入预注册信封；全部 EXPLORATORY——不进确认性指标族/显著性族，不回灌 θ/W/k，增项数据缺席不阻塞主表）：① 基线负载扫 rates [250,500,1000,1500,2000] × 主拓扑（解释 = 预训练源拓扑 CERNET.gml，GATE-2 待用户确认）；② OSPF-agreement 率日志（paper_defaults.eval.ospf_agreement_log，默认 false，on/off 位同 determinism 测试锁定）；③ Δ-vs-OSPF 逐场景面板 + 泛化差距面板（make_figures 小扩展）"}
