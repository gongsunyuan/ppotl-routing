  plan: .omo/plans/experiment-execution-plan.md

# —— threshold（τ 绝对阈值 θ，计划 §5-1）——
# GATE-2 裁决（2026-09-01，§7.4 缺省，v3 留痕）：null 即终局——逐场景按 theta_rule
# 推导本身就是预注册口径（公式无人工自由度）；此后禁回填全局 float（试点单场景
# 数值无法代表主表 4 场景，全局覆盖会把 CERNET 系场景 τ 全删失）。
theta: null
# θ 推导规则（计划 §5-1）：逐 (topo, rate) 场景取
#   θ = max(OSPF 贪心分, 最优臂渐近 − 合并组内 σ)
# OSPF 贪心分 = OSPF 行 eval.json final.r_mean_mean；最优臂渐近 = 学习臂种子内
# 末 asymptote_k 点渐近均值的最大者；合并 σ = 学习臂间 pooled-within-SD
theta_rule: "max(OSPF final r_mean_mean, best-arm asymptote mean - pooled within-arm SD), per (topo, rate)"

# τ 删失窗口 W（回合数，计划 §5-1/§5-2）：曲线窗口末仍未过阈 → τ=W、
# censored=true；同时是 W-AUC 的积分窗口（梯形积分 ÷ W）
window_episodes: 500

# 渐近性能（计划 §5-3）：末 k=5 个评估点均值 ±95%CI（t 分布，n=k；契约 k≥2）
asymptote_k: 5

# 显著性水平（计划 §5 统计）：配对 t / Wilcoxon 逐对检验 + Holm 族校正
alpha: 0.05

# 主指标（计划 §5-1）：τ 为主结论依据，W-AUC/渐近为次指标
primary_metric: tau

# 主表终评回合数统一（issues.md M2.5/M2-4 双轨已裁决退役：D1=YES，2026-08-30，
# 用户 Phase-0 执行指令——全行型（臂/A0/OSPF/启发式）统一 10，θ 的 OSPF 项与
# 启发式行同噪声地板）。OSPF 基线行已删目录重生成对齐（manifest.episodes==10）；
# 启发式行原本即 10 无需重跑；arms 周期曲线评估间隔不受影响。
final_eval_episodes: 10

# —— narrative_extras：主表叙事增项（计划 §5 主表余量；全部 EXPLORATORY）——
# 防事后择优：增项先于主表余量数据生成注册于此；EXPLORATORY = 不进主指标 τ/
# Holm 显著性族，不回灌 θ/W/k。三项均零参数观察/绘图，不改变任何训练语义。
narrative_extras:
  label: exploratory  # 三项统一探索性标签
  load_sweep:  # (i) 基线负载扫：零参数评估行，分钟级
    rates: [250, 500, 1000, 1500, 2000]  # 覆盖源域 500 与目标轴 1500，两侧外推书挡
    topology: Claranet.gml  # 计划措辞"主拓扑"的解释（见 topology_note；v4 随源切换更新）
    topology_note: "计划措辞'主拓扑'解释 = 预训练源拓扑（config/default.yaml paper_defaults.pretrain.topology = Claranet.gml，D6/DEVIATIONS #17 源切换后；v2 注册时为 CERNET.gml，v4 更新）"
    rows: {arms: [OSPF, ECMP, LB, RR], seed: 0, zero_parameter: true}
  ospf_agreement:  # (ii) OSPF-agreement 率日志：纯观察
    flag: paper_defaults.eval.ospf_agreement_log  # config/default.yaml；默认 false；不是 run_id 因素（run_id 确定性不变）
    definition: >-
      贪心评估逐（步, 节点）决策中 argmax(π) == ospf_action（0；D8 贪心下所选动作
      即分布 argmax）的比例；逐评估回合与总体聚合成 eval.json 顶层
      ospf_agreement{per_episode[], overall}
    determinism_proof: tests/test_ospf_agreement_bitmatch.py  # on/off 位同：metrics.csv 逐字节、eval.json 除新增字段
  delta_vs_ospf:  # (iii-a) Δ-vs-OSPF 逐场景面板
    definition: >-
      Δ(arm, 场景) = mean over seeds(arm final r_mean_mean) − OSPF final
      r_mean_mean；误差棒 = 种子 SD；水平零线 = OSPF 平价（正值 = 超 OSPF）
    panel: make_figures delta_vs_ospf 图；缺 OSPF 行或学习臂 final 的场景跳过（优雅降级）
  generalization_gap:  # (iii-b) 泛化差距面板
    definition: >-
      泛化差距 = A0 final vs 同种子适应臂 final（逐共享种子配对差 adapted − A0）
    panel: >-
      make_figures generalization_gap 图，逐场景 A0 vs 适应臂 final（A6 在场取
      A6，否则取该场景 final 种子均值最优学习臂）；缺 A0 行或无学习臂 final
      的场景跳过（优雅降级）
