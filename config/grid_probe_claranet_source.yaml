# config/grid_probe_claranet_source.yaml — 源域切换 probe(CERNET→Claranet 提案,#40)
# 目的:3 种子 Claranet@500 预训练后 A0 域内终评,对比已有五基线
# (OSPF 0.6357/LB 0.6151/ECMP 0.5731/RAND 0.5735/RR 0.5544,全矩阵 d40a375)
# 判定当前冻结配置能否在新源域清启发式。run_id 因 topology 因素与 CERNET 时代零冲突。
# ⛔ 裁决前禁跑;若改选 @250-300,4 个网格的 config_overlay.pretrain.avgrate 同改后再跑。
pretrain:
  seeds: [0, 1, 2]
  episodes: 8000
config_overlay:
  pretrain:
    topology: Claranet.gml
    avgrate: 500
arms: []                # probe 只要预训练+A0;臂波待正式立项后另派
scenarios:
  - {topo: Claranet.gml, avgrate: 500}   # 域内终评场景
seeds: [0, 1, 2]
zeroshot: true          # A0 行(源=同 seed 预训练)
ospf: false             # 五基线已在 runs/(全矩阵)
heuristic: []
