# config/grid_probe_claranet_pretrain_s1.yaml — Claranet 源域切换 probe 执行载体
# 因子:预训练源 Claranet.gml@500(config_overlay 覆盖 default 的 CERNET.gml@500),
# 8000ep, seed 1;与 grid_probe_claranet_source.yaml 同因子,run_id 逐位一致。
# ⛔ 裁决前禁跑(门控见 logs/run_claranet_probe.sh)。
pretrain:
  seeds: [1]
  episodes: 8000
config_overlay:
  pretrain:
    topology: Claranet.gml
    avgrate: 500
arms: []
scenarios: []
seeds: []
zeroshot: false
ospf: false
heuristic: []
